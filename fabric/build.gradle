plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.loom.loader)
    alias(nyfs.plugins.regutils.loader)
    id("com.nyfaria.moddingtools.dependencies")
    id("com.nyfaria.moddingtools.publishing")
    id 'multiloader-fabric'
}

dependencies {
    modApi(nyfs.config.api.fabric)
    include(nyfs.config.api.fabric)
    modImplementation(nyfs.bundles.cc.all)
    include(nyfs.bundles.cc.all)
    modDeps.requiredMod(nyfs.geckolib.fabric, "geckolib", null)
    modDeps.requiredMod(nyfs.sbl.fabric, "smartbrainlib", null)
    modDeps.requiredMod(nyfs.commonnetwork.fabric, "commonnetwork", null)
}
